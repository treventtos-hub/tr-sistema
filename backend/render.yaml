services:
  - type: web
    name: tr-sistema-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: tr-sistema-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: tr-sistema-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: tr-sistema-db
          property: password
      - key: SERVER_PORT
        value: 8080
      - key: APP_AUTH_USERNAME
        sync: false
      - key: APP_AUTH_PASSWORD
        sync: false

databases:
  - name: tr-sistema-db
    databaseName: trcrm
    user: trcrm
